name: Sync demo repos with main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-demo-repos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: TNTEMPLET/apbaseball-demo-admin
            ssh_key_secret: DEMO_SYNC_SSH_KEY_ADMIN
          - repo: TNTEMPLET/apbaseball-demo-dyb
            ssh_key_secret: DEMO_SYNC_SSH_KEY_DYB
          - repo: TNTEMPLET/apbaseball-demo-llb
            ssh_key_secret: DEMO_SYNC_SSH_KEY_LLB
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Load repo deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets[matrix.ssh_key_secret] }}

      - name: Trust github.com SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push main to demo repo
        run: |
          # Demo repos should not receive source-repo workflow files.
          # Pushing workflow changes via deploy-key auth is blocked by GitHub.
          git checkout --detach origin/main
          rm -rf .github/workflows
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: sync demo snapshot"
          else
            git commit -m "chore: sync demo snapshot"
          fi
          git remote add demo "git@github.com:${{ matrix.repo }}.git"
          git push demo "HEAD:refs/heads/main" --force
          git remote remove demo

# Manual copy of production into staging, then PII scrub and migrate deploy.
# Both secrets live on the production environment:
#   PROD_DATABASE_URL, STAGING_DATABASE_URL
# The dump is streamed. Nothing is written to disk or uploaded as an artifact.
# Logs from this workflow should be row counts only — do not echo the URLs.
name: Refresh staging from production

on:
  workflow_dispatch:

jobs:
  refresh-staging:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: db-staging-refresh
      cancel-in-progress: false
    env:
      SKIP_PRISMA_SYNC: "1"
    steps:
      - name: Require distinct production and staging secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          python3 - << 'PY'
          import os, sys
          prod = os.environ.get("PROD_DATABASE_URL") or ""
          staging = os.environ.get("STAGING_DATABASE_URL") or ""
          if not prod:
              print("PROD_DATABASE_URL secret missing in environment production")
              sys.exit(1)
          if not staging:
              print("STAGING_DATABASE_URL secret missing in environment production")
              sys.exit(1)
          if prod == staging:
              print("PROD_DATABASE_URL and STAGING_DATABASE_URL must not be the same")
              sys.exit(1)
          PY

      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Stream production into staging
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_DATABASE_URL" ] || [ -z "$STAGING_DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL or STAGING_DATABASE_URL secret missing in environment production"
            exit 1
          fi
          if [ "$PROD_DATABASE_URL" = "$STAGING_DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL and STAGING_DATABASE_URL must not be the same"
            exit 1
          fi
          export PROD="$PROD_DATABASE_URL"
          export STAGING="$STAGING_DATABASE_URL"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          # Dump is streamed. Error text is redacted so a connection failure cannot print a URL.
          redact() { sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' "$1"; }
          errdir="$(mktemp -d)"
          set +e
          pg_dump "$PROD" --no-owner --no-acl -Fc 2>"$errdir/dump" \
            | pg_restore --clean --if-exists --no-owner --no-acl -d "$STAGING" - 2>"$errdir/restore"
          status=$?
          set -e
          redact "$errdir/dump" >&2 || true
          redact "$errdir/restore" >&2 || true
          rm -rf "$errdir"
          exit "$status"

      - name: Scrub staging PII
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL secret missing in environment production"
            exit 1
          fi
          export STAGING="$STAGING_DATABASE_URL"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          redact() { sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' "$1"; }
          err="$(mktemp)"
          set +e
          psql "$STAGING" -q -v ON_ERROR_STOP=1 -f scripts/staging/scrub.sql 2>"$err"
          status=$?
          set -e
          redact "$err" >&2 || true
          rm -f "$err"
          exit "$status"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL secret missing in environment production"
            exit 1
          fi
          log="$(mktemp)"
          set +e
          pnpm exec prisma migrate deploy >"$log" 2>&1
          status=$?
          set -e
          sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' "$log"
          rm -f "$log"
          exit "$status"

# Manual copy of production into staging, then PII scrub and migrate deploy.
# Both secrets live on the production environment:
#   PROD_DATABASE_URL, STAGING_DATABASE_URL
# The dump is streamed. Nothing is written to disk or uploaded as an artifact.
# Logs from this workflow should be row counts only — do not echo the URLs.
name: Refresh staging from production

on:
  workflow_dispatch:

jobs:
  refresh-staging:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: db-staging-refresh
      cancel-in-progress: false
    env:
      SKIP_PRISMA_SYNC: "1"
    steps:
      - name: Require production and staging secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          python3 - << 'PY'
          import os, sys
          prod = os.environ.get("PROD_DATABASE_URL") or ""
          staging = os.environ.get("STAGING_DATABASE_URL") or ""
          if not prod:
              print("PROD_DATABASE_URL secret missing in environment production")
              sys.exit(1)
          if not staging:
              print("STAGING_DATABASE_URL secret missing in environment production")
              sys.exit(1)
          PY

      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      # Staging must already contain public._environment with one row, value
      # "staging". Production must not have that table. Created by hand on
      # staging only:
      #   CREATE TABLE public._environment (
      #     value text PRIMARY KEY CHECK (value = 'staging')
      #   );
      #   INSERT INTO public._environment (value) VALUES ('staging');
      - name: Confirm staging marker and that production has none
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          if [ -z "$PROD_DATABASE_URL" ] || [ -z "$STAGING_DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL or STAGING_DATABASE_URL secret missing in environment production"
            exit 1
          fi
          redact() { sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' "$1"; }
          run_sql() {
            local url="$1"
            local sql="$2"
            local err
            err="$(mktemp)"
            set +e
            psql "$url" -q -v ON_ERROR_STOP=1 -c "$sql" 2>"$err"
            local status=$?
            set -e
            redact "$err" >&2 || true
            rm -f "$err"
            return "$status"
          }
          staging_sql="DO \$\$
          DECLARE
            n int;
            v text;
          BEGIN
            IF to_regclass('public._environment') IS NULL THEN
              RAISE EXCEPTION 'staging marker missing: public._environment must already exist with one row whose value is staging';
            END IF;
            SELECT count(*) INTO n FROM public._environment;
            IF n <> 1 THEN
              RAISE EXCEPTION 'staging marker public._environment must contain exactly one row';
            END IF;
            SELECT value INTO v FROM public._environment;
            IF v IS DISTINCT FROM 'staging' THEN
              RAISE EXCEPTION 'staging marker public._environment value is not staging';
            END IF;
          END
          \$\$;"
          prod_sql="DO \$\$
          BEGIN
            IF to_regclass('public._environment') IS NOT NULL THEN
              RAISE EXCEPTION 'production must not contain public._environment';
            END IF;
          END
          \$\$;"
          run_sql "$STAGING_DATABASE_URL" "$staging_sql"
          run_sql "$PROD_DATABASE_URL" "$prod_sql"
          echo "Staging marker is present and production has none."

      # pg_restore often exits non-zero after it has already written rows
      # (warnings, --clean drop noise). A failed step must not skip the scrub:
      # staging would be left holding unscrubbed production data.
      - name: Stream production into staging
        id: stream_prod
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_DATABASE_URL" ] || [ -z "$STAGING_DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL or STAGING_DATABASE_URL secret missing in environment production"
            exit 1
          fi
          export PROD="$PROD_DATABASE_URL"
          export STAGING="$STAGING_DATABASE_URL"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          # Dump is streamed. Error text is redacted so a connection failure cannot print a URL.
          redact() { sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' "$1"; }
          errdir="$(mktemp -d)"
          set +e
          pg_dump "$PROD" --no-owner --no-acl -Fc --exclude-table=public._environment 2>"$errdir/dump" \
            | pg_restore --clean --if-exists --no-owner --no-acl -d "$STAGING" - 2>"$errdir/restore"
          status=$?
          set -e
          redact "$errdir/dump" >&2 || true
          redact "$errdir/restore" >&2 || true
          rm -rf "$errdir"
          exit "$status"

      # pg_restore --clean drops public._environment. Put the marker back and
      # re-check it before any scrub. The pre-restore check already proved this
      # URL was staging, and production was proven not to have the table.
      # Runs after a non-zero pg_restore too, so the scrub below can still refuse
      # any database that is not marked staging.
      - name: Restore staging marker after refresh
        id: restore_marker
        if: ${{ always() && (steps.stream_prod.conclusion == 'success' || steps.stream_prod.conclusion == 'failure') }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL secret missing in environment production"
            exit 1
          fi
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          redact() { sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' "$1"; }
          err="$(mktemp)"
          set +e
          psql "$STAGING_DATABASE_URL" -q -v ON_ERROR_STOP=1 <<'SQL' 2>"$err"
          CREATE TABLE IF NOT EXISTS public._environment (
            value text PRIMARY KEY CHECK (value = 'staging')
          );
          DELETE FROM public._environment;
          INSERT INTO public._environment (value) VALUES ('staging');
          DO $$
          DECLARE
            n int;
            v text;
          BEGIN
            SELECT count(*) INTO n FROM public._environment;
            SELECT value INTO v FROM public._environment;
            IF n <> 1 OR v IS DISTINCT FROM 'staging' THEN
              RAISE EXCEPTION 'staging marker was not restored';
            END IF;
          END
          $$;
          SQL
          status=$?
          set -e
          redact "$err" >&2 || true
          rm -f "$err"
          exit "$status"

      # always() so a non-zero pg_restore cannot skip this step. The job still
      # fails when the restore step failed; later install/migrate steps stay
      # skipped. Cancelled runs do not scrub (stream_prod.conclusion is cancelled).
      - name: Scrub staging PII
        id: scrub_pii
        if: ${{ always() && (steps.stream_prod.conclusion == 'success' || steps.stream_prod.conclusion == 'failure') }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL secret missing in environment production"
            exit 1
          fi
          export STAGING="$STAGING_DATABASE_URL"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          redact() { sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' "$1"; }
          err="$(mktemp)"
          set +e
          psql "$STAGING" -q -v ON_ERROR_STOP=1 -f scripts/staging/scrub.sql 2>"$err"
          status=$?
          set -e
          redact "$err" >&2 || true
          rm -f "$err"
          exit "$status"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL secret missing in environment production"
            exit 1
          fi
          log="$(mktemp)"
          set +e
          pnpm exec prisma migrate deploy >"$log" 2>&1
          status=$?
          set -e
          sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' "$log"
          rm -f "$log"
          exit "$status"
